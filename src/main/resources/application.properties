spring.application.name=service-factories

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/factories}
spring.datasource.username=${DB_USER:factories}
spring.datasource.password=${DB_PASSWORD:factories}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always

plan.service.url=${PLAN_SERVICE_URL:http://localhost:8081}
